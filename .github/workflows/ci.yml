name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # Lints the demo corpus. It prints one intentional staleness warning
      # (advisory currency finding) and still exits 0 — warnings must never
      # fail CI; only integrity violations do.
      - run: bun run validate
